  <!-- Script de Controle do Shell Principal -->
  <script>
    window.AppShell = (function() {
      var currentTab = 'calendar';
      var permissions = {
        email: '',
        canEdit: false,
        isManager: false,
        papel: ''
      };

      function loadingStart(message) {
        if (window.VdLoading) window.VdLoading.start(message);
      }

      function loadingDone() {
        if (window.VdLoading) window.VdLoading.done();
      }

      function fetchPermissions() {
        if (typeof google === 'undefined' || !google.script || !google.script.run) {
          permissions.canEdit = true;
          permissions.isManager = true;
          return;
        }

        loadingStart('Preparando sua sessão…');
        google.script.run
          .withSuccessHandler(function(responseStr) {
            try {
              var resp = JSON.parse(responseStr);
              if (resp.success) {
                permissions.email = resp.email;
                permissions.canEdit = resp.canEdit;
                permissions.isManager = !!resp.isManager;
                permissions.papel = resp.papel || '';
                window.dispatchEvent(new CustomEvent('vdCore:permissionsLoaded', { detail: permissions }));
              }
            } catch(e) {}
            loadingDone();
          })
          .withFailureHandler(function() {
            loadingDone();
          })
          .getUserPermissions();
      }

      function switchTab(tabId) {
        currentTab = tabId;
        if (window.VdLoading) window.VdLoading.reset();

        document.querySelectorAll('.tab-view').forEach(function(el) {
          el.classList.add('hidden');
        });

        ['capacity', 'batman', 'calendar', 'holidays', 'releasenotes', 'absences', 'rituals'].forEach(function(t) {
          var btn = document.getElementById('tab-' + t);
          if (btn) {
            btn.className = "py-3 text-xs font-bold border-b-2 border-transparent text-slate-500 hover:text-slate-800 dark:text-slate-400 dark:hover:text-slate-200 flex items-center gap-2 shrink-0 transition-all cursor-pointer";
          }
        });

        var activeView = document.getElementById('view-' + tabId);
        if (activeView) activeView.classList.remove('hidden');

        var activeBtn = document.getElementById('tab-' + tabId);
        if (activeBtn) {
          activeBtn.className = "py-3 text-xs font-bold border-b-2 border-[#008775] text-[#008775] dark:text-[#2dd4bf] flex items-center gap-2 shrink-0 transition-all cursor-pointer";
        }

        if (tabId === 'calendar' && window.CalendarModule && window.CalendarModule.show) {
          window.CalendarModule.show();
        } else if (tabId === 'holidays' && window.HolidaysModule && window.HolidaysModule.show) {
          window.HolidaysModule.show();
        } else if (tabId === 'batman' && window.BatmanModule && window.BatmanModule.show) {
          window.BatmanModule.show();
        } else if (tabId === 'capacity' && window.CapacityModule && window.CapacityModule.show) {
          window.CapacityModule.show();
        } else if (tabId === 'releasenotes' && window.ReleaseNotesModule && window.ReleaseNotesModule.show) {
          window.ReleaseNotesModule.show();
        } else if (tabId === 'absences' && window.AbsencesModule && window.AbsencesModule.show) {
          window.AbsencesModule.show();
        } else if (tabId === 'rituals' && window.RitualsModule && window.RitualsModule.show) {
          window.RitualsModule.show();
        }
      }

      function initModules() {
        fetchPermissions();
        if (window.HeaderModule && window.HeaderModule.init) window.HeaderModule.init();
        if (window.CapacityModule && window.CapacityModule.init) window.CapacityModule.init();
        if (window.BatmanModule && window.BatmanModule.init) window.BatmanModule.init();
        if (window.CalendarModule && window.CalendarModule.init) window.CalendarModule.init();
        if (window.HolidaysModule && window.HolidaysModule.init) window.HolidaysModule.init();
        if (window.ReleaseNotesModule && window.ReleaseNotesModule.init) window.ReleaseNotesModule.init();
        if (window.AbsencesModule && window.AbsencesModule.init) window.AbsencesModule.init();
        if (window.RitualsModule && window.RitualsModule.init) window.RitualsModule.init();
        if (window.DeployModal && window.DeployModal.init) window.DeployModal.init();
      }

      document.addEventListener('DOMContentLoaded', function() {
        initModules();
        switchTab('calendar');
      });

      return {
        switchTab: switchTab,
        canEdit: function() { return permissions.canEdit; },
        isManager: function() { return permissions.isManager; },
        getUserEmail: function() { return permissions.email; },
        loading: {
          start: loadingStart,
          done: loadingDone,
          reset: function() { if (window.VdLoading) window.VdLoading.reset(); }
        }
      };
    })();
  </script>
