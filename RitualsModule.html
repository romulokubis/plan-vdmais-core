<div id="RitualsModuleContainer" class="flex flex-col gap-6 w-full">

  <div class="bg-white dark:bg-slate-800 rounded-2xl border border-slate-200/80 dark:border-slate-700 p-6 shadow-sm flex flex-col sm:flex-row justify-between items-start sm:items-center gap-4">
    <div>
      <h2 class="text-xl font-bold text-slate-900 dark:text-white">Ritos</h2>
      <p class="text-xs text-slate-500 dark:text-slate-400 mt-0.5">Cadência e horas por ocorrência — o desconto cai só nas datas em que o rito ocorre no período</p>
    </div>
    <button id="btnCreateRitual" onclick="RitualsModule.openCreate()" class="hidden bg-[#008775] hover:bg-[#006e5f] text-white px-5 py-2.5 rounded-full text-xs font-bold shadow-sm transition-all flex items-center gap-1.5 focus:outline-none cursor-pointer select-none shrink-0">
      <span>+</span> Novo rito
    </button>
  </div>

  <div class="bg-white dark:bg-slate-800 rounded-2xl border border-slate-200/80 dark:border-slate-700 p-6 shadow-sm">
    <div class="overflow-x-auto">
      <table class="w-full text-left border-collapse text-sm">
        <thead>
          <tr class="border-b border-slate-200 dark:border-slate-700 text-xs font-semibold text-slate-400 uppercase tracking-wider">
            <th class="py-3 px-3">ID</th>
            <th class="py-3 px-3">Nome</th>
            <th class="py-3 px-3 text-center">Cadência</th>
            <th class="py-3 px-3 text-center">Horas/ocorrência</th>
            <th class="py-3 px-3 text-center">Âncora</th>
            <th class="py-3 px-3 text-center">Obrigatório</th>
            <th class="py-3 px-3 text-right">Ações</th>
          </tr>
        </thead>
        <tbody id="ritualsTableBody" class="divide-y divide-slate-100 dark:divide-slate-700/60">
          <tr>
            <td colspan="7" class="py-6 text-center text-xs text-slate-400">Abra a aba para carregar.</td>
          </tr>
        </tbody>
      </table>
    </div>
  </div>

</div>

<div id="ritualModalBackdrop" class="fixed inset-0 bg-slate-900/60 backdrop-blur-sm z-50 hidden flex items-center justify-center p-4">
  <div class="bg-white dark:bg-slate-800 rounded-2xl border border-slate-200 dark:border-slate-700 w-full max-w-lg shadow-2xl overflow-hidden">
    <div class="px-6 py-4 border-b border-slate-100 dark:border-slate-700 flex justify-between items-center">
      <div class="flex items-center gap-2">
        <span class="text-xl">⏱️</span>
        <h3 class="text-base font-bold text-slate-900 dark:text-white" id="ritualModalTitle">Novo rito</h3>
      </div>
      <button type="button" onclick="RitualsModule.closeModal()" class="text-slate-400 hover:text-slate-600 dark:hover:text-slate-200 text-lg font-bold focus:outline-none cursor-pointer">&times;</button>
    </div>

    <form id="ritualForm" onsubmit="RitualsModule.handleSubmit(event)" class="p-6 space-y-4">
      <input type="hidden" id="ritualInputId" value="" />

      <div>
        <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1">Nome *</label>
        <input type="text" id="ritualInputNome" required placeholder="Ex: Daily, Planning, Retro" class="w-full px-3 py-2 text-sm rounded-lg border border-slate-300 dark:border-slate-600 dark:bg-slate-900 dark:text-white focus:ring-2 focus:ring-[#008775] focus:outline-none" />
      </div>

      <div class="grid grid-cols-1 md:grid-cols-2 gap-4">
        <div>
          <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1">Cadência *</label>
          <select id="ritualInputCadencia" required class="w-full px-3 py-2 text-sm rounded-lg border border-slate-300 dark:border-slate-600 dark:bg-slate-900 dark:text-white focus:ring-2 focus:ring-[#008775] focus:outline-none cursor-pointer">
            <option value="Diaria">Diária</option>
            <option value="Quinzenal">Quinzenal</option>
            <option value="Mensal">Mensal</option>
            <option value="Trimestral">Trimestral</option>
            <option value="Semestral">Semestral</option>
          </select>
        </div>
        <div>
          <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1">Horas / ocorrência *</label>
          <input type="number" id="ritualInputHoras" required min="0.25" step="0.25" placeholder="Ex: 1.5" class="w-full px-3 py-2 text-sm rounded-lg border border-slate-300 dark:border-slate-600 dark:bg-slate-900 dark:text-white focus:ring-2 focus:ring-[#008775] focus:outline-none" />
        </div>
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1">Data âncora</label>
        <input type="date" id="ritualInputAncora" class="w-full px-3 py-2 text-sm rounded-lg border border-slate-300 dark:border-slate-600 dark:bg-slate-900 dark:text-white focus:ring-2 focus:ring-[#008775] focus:outline-none" />
        <p class="mt-1 text-[10px] text-slate-400">Opcional. Alinha quinzenal/mensal à data real da cerimônia.</p>
      </div>

      <div>
        <label class="block text-xs font-semibold text-slate-700 dark:text-slate-300 mb-1">Obrigatório *</label>
        <select id="ritualInputObrigatorio" required class="w-full px-3 py-2 text-sm rounded-lg border border-slate-300 dark:border-slate-600 dark:bg-slate-900 dark:text-white focus:ring-2 focus:ring-[#008775] focus:outline-none cursor-pointer">
          <option value="Sim">Sim (entra na capacidade)</option>
          <option value="Não">Não</option>
        </select>
      </div>

      <div id="ritualModalFeedback" class="hidden text-xs py-2 px-3 rounded-lg"></div>

      <div class="pt-3 border-t border-slate-100 dark:border-slate-700 flex justify-end gap-3">
        <button type="button" onclick="RitualsModule.closeModal()" class="px-4 py-2 text-xs font-medium text-slate-600 dark:text-slate-300 hover:bg-slate-100 dark:hover:bg-slate-700 rounded-lg transition-all cursor-pointer">Fechar</button>
        <button type="submit" id="btnSubmitRitual" class="px-5 py-2 text-xs font-bold text-white bg-[#008775] hover:bg-[#006e5f] rounded-lg shadow transition-all cursor-pointer">Salvar</button>
      </div>
    </form>
  </div>
</div>

<script>
window.RitualsModule = (function() {
  var state = {
    items: [],
    isManager: false
  };

  var CADENCIA_LABEL = {
    Diaria: 'Diária',
    Quinzenal: 'Quinzenal',
    Mensal: 'Mensal',
    Trimestral: 'Trimestral',
    Semestral: 'Semestral'
  };

  function escapeHtml(value) {
    return String(value || '')
      .replace(/&/g, '&amp;')
      .replace(/</g, '&lt;')
      .replace(/>/g, '&gt;')
      .replace(/"/g, '&quot;');
  }

  function applyPermissionsUI() {
    var btn = document.getElementById('btnCreateRitual');
    if (!btn) return;
    if (state.isManager) btn.classList.remove('hidden');
    else btn.classList.add('hidden');
  }

  function syncPermissions() {
    if (window.AppShell && typeof window.AppShell.isManager === 'function') {
      state.isManager = window.AppShell.isManager();
    }
    applyPermissionsUI();
  }

  function showFeedback(message, isError) {
    var el = document.getElementById('ritualModalFeedback');
    if (!el) return;
    el.classList.remove('hidden', 'bg-red-50', 'text-red-700', 'bg-emerald-50', 'text-emerald-700');
    el.classList.add(isError ? 'bg-red-50' : 'bg-emerald-50', isError ? 'text-red-700' : 'text-emerald-700');
    el.textContent = message;
  }

  function closeModal() {
    var backdrop = document.getElementById('ritualModalBackdrop');
    if (backdrop) backdrop.classList.add('hidden');
  }

  function openCreate() {
    if (!state.isManager) return;
    document.getElementById('ritualModalTitle').textContent = 'Novo rito';
    document.getElementById('ritualInputId').value = '';
    document.getElementById('ritualInputNome').value = '';
    document.getElementById('ritualInputCadencia').value = 'Diaria';
    document.getElementById('ritualInputHoras').value = '';
    document.getElementById('ritualInputAncora').value = '';
    document.getElementById('ritualInputObrigatorio').value = 'Sim';
    document.getElementById('ritualModalFeedback').classList.add('hidden');
    document.getElementById('ritualModalBackdrop').classList.remove('hidden');
  }

  function toInputDate(value) {
    if (!value) return '';
    var parts = String(value).trim().split(/[\/\-]/);
    if (parts.length !== 3) return '';
    if (parts[0].length === 4) return parts[0] + '-' + parts[1] + '-' + parts[2];
    return parts[2] + '-' + parts[1] + '-' + parts[0];
  }

  function openEdit(id) {
    if (!state.isManager) return;
    var found = state.items.find(function(item) { return item.id === id; });
    if (!found) return;
    document.getElementById('ritualModalTitle').textContent = 'Editar ' + id;
    document.getElementById('ritualInputId').value = id;
    document.getElementById('ritualInputNome').value = found.nome || '';
    document.getElementById('ritualInputCadencia').value = found.cadencia || 'Diaria';
    document.getElementById('ritualInputHoras').value = found.horasOcorrencia || '';
    document.getElementById('ritualInputAncora').value = toInputDate(found.dataAncora);
    document.getElementById('ritualInputObrigatorio').value = found.obrigatorio === 'Sim' ? 'Sim' : 'Não';
    document.getElementById('ritualModalFeedback').classList.add('hidden');
    document.getElementById('ritualModalBackdrop').classList.remove('hidden');
  }

  function handleSubmit(event) {
    event.preventDefault();
    if (!state.isManager) return;

    var payload = {
      id: document.getElementById('ritualInputId').value || '',
      nome: document.getElementById('ritualInputNome').value,
      cadencia: document.getElementById('ritualInputCadencia').value,
      horasOcorrencia: document.getElementById('ritualInputHoras').value,
      dataAncora: document.getElementById('ritualInputAncora').value,
      obrigatorio: document.getElementById('ritualInputObrigatorio').value
    };

    var btn = document.getElementById('btnSubmitRitual');
    if (btn) {
      btn.disabled = true;
      btn.textContent = 'Salvando...';
    }

    if (typeof google === 'undefined' || !google.script || !google.script.run) {
      showFeedback('Ambiente local: alteração não persistida.', true);
      if (btn) { btn.disabled = false; btn.textContent = 'Salvar'; }
      return;
    }

    var runner = google.script.run
      .withSuccessHandler(function(responseStr) {
        if (btn) { btn.disabled = false; btn.textContent = 'Salvar'; }
        try {
          var resp = JSON.parse(responseStr);
          if (resp.success) {
            closeModal();
            window.dispatchEvent(new CustomEvent('vdCore:ritualsChanged'));
          } else {
            showFeedback(resp.message || 'Não foi possível salvar.', true);
          }
        } catch (e) {
          showFeedback('Erro ao processar resposta.', true);
        }
      })
      .withFailureHandler(function(err) {
        if (btn) { btn.disabled = false; btn.textContent = 'Salvar'; }
        showFeedback('Falha no servidor: ' + err.message, true);
      });

    if (payload.id) runner.updateRitual(payload);
    else runner.saveRitual(payload);
  }

  function deleteItem(id) {
    if (!state.isManager) return;
    if (!confirm('Excluir o rito ' + id + '?')) return;

    if (typeof google === 'undefined' || !google.script || !google.script.run) {
      state.items = state.items.filter(function(item) { return item.id !== id; });
      render();
      return;
    }

    google.script.run
      .withSuccessHandler(function(responseStr) {
        try {
          var resp = JSON.parse(responseStr);
          if (resp.success) window.dispatchEvent(new CustomEvent('vdCore:ritualsChanged'));
          else alert(resp.message || 'Não foi possível excluir.');
        } catch (e) {
          alert('Erro ao processar resposta.');
        }
      })
      .withFailureHandler(function(err) {
        alert('Falha no servidor: ' + err.message);
      })
      .deleteRitual(id);
  }

  function render() {
    var tbody = document.getElementById('ritualsTableBody');
    if (!tbody) return;

    if (!state.items.length) {
      tbody.innerHTML = '<tr><td colspan="7" class="py-6 text-center text-xs text-slate-400">Nenhum rito cadastrado.</td></tr>';
      return;
    }

    var html = '';
    state.items.forEach(function(item) {
      var cadLabel = CADENCIA_LABEL[item.cadencia] || item.cadencia || '—';
      var actions = '';
      if (state.isManager) {
        actions =
          '<button type="button" onclick="RitualsModule.openEdit(\'' + escapeHtml(item.id) + '\')" class="p-1 rounded-md text-slate-400 hover:text-[#008775] dark:hover:text-[#2dd4bf] hover:bg-slate-100 dark:hover:bg-slate-700 transition-all cursor-pointer text-xs" title="Editar">✏️</button>' +
          '<button type="button" onclick="RitualsModule.deleteItem(\'' + escapeHtml(item.id) + '\')" class="p-1 rounded-md text-slate-400 hover:text-rose-600 dark:hover:text-rose-400 hover:bg-slate-100 dark:hover:bg-slate-700 transition-all cursor-pointer text-xs" title="Excluir">🗑️</button>';
      }

      html +=
        '<tr class="hover:bg-slate-50/80 dark:hover:bg-slate-900/30">' +
          '<td class="py-3 px-3 font-mono text-xs text-slate-500">' + escapeHtml(item.id) + '</td>' +
          '<td class="py-3 px-3 text-xs font-medium text-slate-900 dark:text-white">' + escapeHtml(item.nome) + '</td>' +
          '<td class="py-3 px-3 text-center text-xs text-slate-600 dark:text-slate-300">' + escapeHtml(cadLabel) + '</td>' +
          '<td class="py-3 px-3 text-center text-xs text-slate-600 dark:text-slate-300">' + escapeHtml(item.horasOcorrencia) + '</td>' +
          '<td class="py-3 px-3 text-center text-xs text-slate-600 dark:text-slate-300">' + escapeHtml(item.dataAncora || '—') + '</td>' +
          '<td class="py-3 px-3 text-center text-xs text-slate-600 dark:text-slate-300">' + escapeHtml(item.obrigatorio) + '</td>' +
          '<td class="py-3 px-3 text-right whitespace-nowrap">' + actions + '</td>' +
        '</tr>';
    });
    tbody.innerHTML = html;
  }

  function loadingStart(message) {
    if (window.AppShell && window.AppShell.loading) window.AppShell.loading.start(message);
    else if (window.VdLoading) window.VdLoading.start(message);
  }

  function loadingDone() {
    if (window.AppShell && window.AppShell.loading) window.AppShell.loading.done();
    else if (window.VdLoading) window.VdLoading.done();
  }

  function fetchItems() {
    var tbody = document.getElementById('ritualsTableBody');
    if (tbody) {
      tbody.innerHTML = '<tr><td colspan="7" class="py-6 text-center text-xs text-slate-400">Carregando...</td></tr>';
    }

    if (typeof google === 'undefined' || !google.script || !google.script.run) {
      state.items = [];
      render();
      return;
    }

    loadingStart('Carregando ritos…');
    google.script.run
      .withSuccessHandler(function(responseStr) {
        try {
          var resp = JSON.parse(responseStr);
          if (resp.success) {
            state.items = resp.data || [];
            render();
          } else if (tbody) {
            tbody.innerHTML = '<tr><td colspan="7" class="py-6 text-center text-xs text-red-500">' + escapeHtml(resp.message) + '</td></tr>';
          }
        } catch (e) {
          if (tbody) {
            tbody.innerHTML = '<tr><td colspan="7" class="py-6 text-center text-xs text-red-500">Erro ao processar resposta.</td></tr>';
          }
        }
        loadingDone();
      })
      .withFailureHandler(function(err) {
        if (tbody) {
          tbody.innerHTML = '<tr><td colspan="7" class="py-6 text-center text-xs text-red-500">Falha: ' + escapeHtml(err.message) + '</td></tr>';
        }
        loadingDone();
      })
      .getRituals();
  }

  return {
    init: function() {
      syncPermissions();
      window.addEventListener('vdCore:permissionsLoaded', function(e) {
        if (e && e.detail) state.isManager = !!e.detail.isManager;
        applyPermissionsUI();
        render();
      });
      window.addEventListener('vdCore:ritualsChanged', function() {
        fetchItems();
      });
    },
    show: function() {
      syncPermissions();
      fetchItems();
    },
    openCreate: openCreate,
    openEdit: openEdit,
    deleteItem: deleteItem,
    closeModal: closeModal,
    handleSubmit: handleSubmit
  };
})();
</script>
