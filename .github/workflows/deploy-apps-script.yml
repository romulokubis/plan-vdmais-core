name: Deploy Apps Script

on:
  push:
    branches: [main, Main]
  workflow_dispatch:

concurrency:
  group: deploy-apps-script-prod
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      DEPLOYMENT_ID: AKfycbxDtmipjPVnfOi8QFyMn1uumaFr1y3xP9rziNoNMVJqatV1ZQ_lBkiUVBTh6m_ZJXeq_A
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci

      - name: Write clasp credentials
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          node <<'NODE'
          const fs = require('fs');
          const os = require('os');
          const path = require('path');
          const raw = process.env.CLASPRC_JSON;
          if (!raw || !raw.trim()) {
            console.error('Secret CLASPRC_JSON vazio');
            process.exit(1);
          }
          const out = path.join(os.homedir(), '.clasprc.json');
          fs.writeFileSync(out, raw, 'utf8');
          JSON.parse(fs.readFileSync(out, 'utf8'));
          console.log('clasprc JSON ok');
          NODE

      - run: npx clasp push --force
      - run: npx clasp deploy --deploymentId "$DEPLOYMENT_ID" --description "CI ${GITHUB_SHA::7}"
      - run: echo "https://script.google.com/a/macros/grupoboticario.com.br/s/${DEPLOYMENT_ID}/exec"