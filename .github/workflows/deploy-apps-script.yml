name: Deploy Apps Script

on:
  push:
    branches: [main, Main]
  workflow_dispatch:

concurrency:
  group: deploy-apps-script-prod
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      DEPLOYMENT_ID: AKfycbxDtmipjPVnfOi8QFyMn1uumaFr1y3xP9rziNoNMVJqatV1ZQ_lBkiUVBTh6m_ZJXeq_A
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci

      - name: Write clasp credentials
        env:
          CLASPRC_JSON_B64: ${{ secrets.CLASPRC_JSON_B64 }}
        run: |
          if [ -z "$CLASPRC_JSON_B64" ]; then
            echo "::error::Secret CLASPRC_JSON_B64 não configurado."
            exit 1
          fi
          echo "$CLASPRC_JSON_B64" | base64 -d > "$HOME/.clasprc.json"
          chmod 600 "$HOME/.clasprc.json"
          node -e "JSON.parse(require('fs').readFileSync(require('os').homedir()+'/.clasprc.json','utf8')); console.log('clasprc JSON ok')"

      - run: npx clasp push --force
      - run: npx clasp deploy --deploymentId "$DEPLOYMENT_ID" --description "CI ${GITHUB_SHA::7}"
      - run: echo "https://script.google.com/a/macros/grupoboticario.com.br/s/${DEPLOYMENT_ID}/exec"