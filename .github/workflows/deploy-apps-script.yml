name: Deploy Apps Script

on:
  push:
    branches: [main, Main]
  workflow_dispatch:

concurrency:
  group: deploy-apps-script-prod
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    env:
      DEPLOYMENT_ID: AKfycbxDtmipjPVnfOi8QFyMn1uumaFr1y3xP9rziNoNMVJqatV1ZQ_lBkiUVBTh6m_ZJXeq_A
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
      - run: npm ci
      - name: Write clasp credentials
        env:
          CLASPRC_JSON: ${{ secrets.CLASPRC_JSON }}
        run: |
          if [ -z "$CLASPRC_JSON" ]; then
            echo "::error::Secret CLASPRC_JSON não configurado."
            exit 1
          fi
          echo "$CLASPRC_JSON" > "$HOME/.clasprc.json"
          chmod 600 "$HOME/.clasprc.json"
      - run: npx clasp push --force
      - run: npx clasp deploy --deploymentId "$DEPLOYMENT_ID" --description "CI ${GITHUB_SHA::7}"
      - run: echo "https://script.google.com/a/macros/grupoboticario.com.br/s/${DEPLOYMENT_ID}/exec"
