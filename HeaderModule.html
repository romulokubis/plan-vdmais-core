<header class="bg-white dark:bg-slate-800 border-b border-slate-200/80 dark:border-slate-700 px-8 py-4 flex justify-between items-center">
  <div class="flex items-center gap-3">
    <!-- Logo vd com SVG Oficial -->
    <div class="flex items-center gap-2 font-extrabold text-xl text-slate-900 dark:text-white select-none">
      <span class="tracking-tight">vd</span>
      <svg class="h-6 w-6" viewBox="0 0 24 24" fill="none">
        <rect x="2" y="10" width="7" height="4" rx="1.5" fill="#F97316"></rect>
        <rect x="15" y="10" width="7" height="4" rx="1.5" fill="#38BDF8"></rect>
        <rect x="10" y="2" width="4" height="20" rx="1.5" fill="#84CC16"></rect>
      </svg>
    </div>
    
    <!-- Divisor e Título -->
    <div class="border-l border-slate-300 dark:border-slate-600 pl-3">
      <h1 class="text-base font-bold text-slate-900 dark:text-white leading-tight">Engenharia VD+ Core</h1>
      <p id="userGreeting" class="text-xs text-slate-500 dark:text-slate-400">Olá, como está o seu dia?</p>
    </div>
  </div>

  <!-- Dark/Light Theme Toggle -->
  <button onclick="HeaderModule.toggleTheme()" class="w-9 h-9 rounded-full bg-slate-100 dark:bg-slate-700 flex items-center justify-center text-slate-600 dark:text-slate-200 hover:bg-slate-200 dark:hover:bg-slate-600 transition-all focus:outline-none" title="Alternar Tema">
    <span id="themeToggleIcon">🌙</span>
  </button>
</header>

<script>
window.HeaderModule = (function() {
  function applyTheme(isDark) {
    if (isDark) {
      document.documentElement.classList.add('dark');
      document.getElementById('themeToggleIcon').innerText = '☀️';
      localStorage.setItem('vdCore_theme', 'dark');
    } else {
      document.documentElement.classList.remove('dark');
      document.getElementById('themeToggleIcon').innerText = '🌙';
      localStorage.setItem('vdCore_theme', 'light');
    }
    window.dispatchEvent(new CustomEvent('vdCore:themeChanged', {
      detail: { theme: isDark ? 'dark' : 'light' }
    }));
  }

  function setDynamicGreeting() {
    if (typeof google !== 'undefined' && google.script && google.script.run) {
      google.script.run
        .withSuccessHandler(function(email) {
          if (email) {
            const rawName = email.split('@')[0].split('.')[0];
            const formattedName = rawName.charAt(0).toUpperCase() + rawName.slice(1);
            document.getElementById('userGreeting').innerText = `Olá ${formattedName}, como está o seu dia?`;
          }
        })
        .getUserEmail();
    }
  }

  return {
    init: function() {
      const savedTheme = localStorage.getItem('vdCore_theme');
      const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
      applyTheme(savedTheme === 'dark' || (!savedTheme && prefersDark));
      setDynamicGreeting();
    },
    toggleTheme: function() {
      const isDark = document.documentElement.classList.contains('dark');
      applyTheme(!isDark);
    }
  };
})();
</script>
